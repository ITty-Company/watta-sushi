services:
  # Backend API Service
  - type: web
    name: watta-sushi-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run migrate && npm run seed
    startCommand: npm run start:single
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false  # Нужно будет добавить вручную в Render dashboard
      - key: JWT_SECRET
        sync: false  # Нужно будет добавить вручную в Render dashboard

  # Frontend Web Service
  - type: web
    name: watta-sushi-web
    env: node
    plan: free
    rootDir: web
    buildCommand: NODE_ENV=development npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_API_URL
        # ВАЖНО: Замените на реальный URL вашего backend сервиса на Render
        # Обычно это https://watta-sushi-backend.onrender.com или похожий URL
        value: https://watta-sushi-9qfh.onrender.com
