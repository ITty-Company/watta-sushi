# Blueprint Render: Postgres + API (Express) + Next.js.
# Документація: https://render.com/docs/blueprint-spec
#
# Щоб прод як локально (відео в public/, меню з БД після seed):
# 1) Закомітьте web/public/*.mp4 — вони мають потрапити в Git і в білд Next.
# 2) Після зміни URL бекенду: Web → Clear build cache → Manual Deploy (NEXT_PUBLIC_* вшивається в білді).
#    Додатково BACKEND_URL (те саме джерело, що API) — runtime для Route Handlers без залежності від інлайну.
# 3) На бекенді за потреби: FRONTEND_URL = публічний URL фронту; CORS_ORIGINS = дод. домени через кому.
#
# Якщо сервіси вже створені вручну в Dashboard — звірте:
# - У API: Root Directory = backend, міграції в build, DATABASE_URL з БД, без фіксованого PORT.
# - У Web: Root Directory = web, NEXT_PUBLIC_API_URL = публічний URL API (https://…onrender.com).
#
# ВАЖЛИВО: URL бекенду (Express) і URL фронту (Next) — РІЗНІ сервіси. У логах «start:single --prefix backend»
# це API; сайт у браузері відкривайте за URL сервісу watta-sushi-web (або вашим ім’ям Web Service).

databases:
  - name: watta-sushi-db
    databaseName: watta_sushi
    user: watta_sushi_user
    plan: free

services:
  - type: web
    name: watta-sushi-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm run start:single
    envVars:
      - key: NODE_ENV
        value: production
      # PORT задає Render автоматично — не фіксуйте 3001/5000 у Dashboard.
      - key: DATABASE_URL
        fromDatabase:
          name: watta-sushi-db
          property: connectionString
      # Після підключення Persistent Disk (Starter+): Mount Path /var/data → UPLOAD_DIR=/var/data/uploads
      - key: UPLOAD_DIR
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # Публічний URL фронту (LiqPay, редіректи). Після першого деплою web вкажіть https://…onrender.com (без / в кінці).
      - key: FRONTEND_URL
        sync: false
      # Додаткові Origin для CORS через кому (кастомний домен диплому тощо).
      - key: CORS_ORIGINS
        sync: false
      # Google Sheets (опційно): JSON сервісного акаунта в один рядок; без цього замовлення в таблицю не пишуться.
      - key: GOOGLE_CREDS
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      # LiqPay (рекомендовано для UA/EU) або Stripe — без ключів у кошику лише готівка
      - key: LIQPAY_PUBLIC_KEY
        sync: false
      - key: LIQPAY_PRIVATE_KEY
        sync: false
      # Публічний URL API для LiqPay callback (Render задає RENDER_EXTERNAL_URL автоматично)
      - key: PUBLIC_API_URL
        sync: false
      # Stripe Checkout — альтернатива LiqPay
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Google OAuth (вхід через Google) — Client ID з Google Cloud Console
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false

  - type: web
    name: watta-sushi-web
    env: node
    plan: free
    rootDir: web
    buildCommand: bash build.sh
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      # Сплеш «Завантаження» (лого) на головній при перезавантаженні (F5),
      # далі одразу hero-відео без миготіння. Вшивається в білд (NEXT_PUBLIC_*).
      - key: NEXT_PUBLIC_WATTA_BOOT_SPLASH
        value: "1"
      # Публічна адреса API — підставляється з бекенд-сервісу під час білду.
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: watta-sushi-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      # Той самий URL для server-side (rewrites + /app/api/auth/*); runtime, зручно після зміни API без кешу білду.
      - key: BACKEND_URL
        fromService:
          name: watta-sushi-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      # Той самий Client ID, що GOOGLE_OAUTH_CLIENT_ID на бекенді (вшивається в білд)
      - key: NEXT_PUBLIC_GOOGLE_OAUTH_CLIENT_ID
        sync: false
