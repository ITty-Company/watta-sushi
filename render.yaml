services:
  # PostgreSQL Database
  - type: pg
    name: watta-sushi-db
    plan: free
    databaseName: watta_sushi
    user: watta_sushi_user

  # Backend API Service
  - type: web
    name: watta-sushi-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate
    startCommand: npm run init-db && npm run start:single
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromService:
          type: pg
          name: watta-sushi-db
          property: connectionString
      - key: JWT_SECRET
        sync: false  # Нужно будет добавить вручную в Render dashboard

  # Frontend Web Service
  - type: web
    name: watta-sushi-web
    env: node
    plan: free
    rootDir: web
    buildCommand: NODE_ENV=development npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_API_URL
        # URL бэкенда на Render (реальный URL из Render Dashboard)
        value: https://watta-sushi-9qfh.onrender.com
